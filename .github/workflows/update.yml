name: 每週更新護理課程資料

# 每週日 15:00（台北時間）自動更新，亦可手動觸發
on:
  schedule:
    - cron: '0 7 * * 0'   # 07:00 UTC = 15:00 台北時間，週日
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update (scrape + build)
        run: python scripts/update.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add data/events.json index.html
            git commit -m "chore: 每週自動更新課程資料 ($(TZ=Asia/Taipei date +%Y-%m-%d))"
            git push
          else
            echo "無變更，略過提交"
          fi
